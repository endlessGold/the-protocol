[workspace]
resolver = "2"
members = [
    "core/runtime",
    "core/network",
    "core/protocol",
    "core/session",
    "core/plugin",
    "core/scheduler",
    "core/security",
    "core/routing",
    "core/observability",
    "core/presentation",
    "domain",
    "application",
    "clients/mud",
    "tools/wat2wasm",
]

# bindings/godot is deliberately NOT a workspace member. It depends on the
# external `godot` (gdext) crate, whose exact version/API could not be
# verified by compiling anything (see that crate's lib.rs header). Keeping
# it out of the default `--workspace` build means a wrong gdext version
# can't break CI for the entire core; it gets its own advisory CI job
# instead (see .github/workflows/ci.yml). Build it explicitly with
# `cargo build --manifest-path bindings/godot/Cargo.toml`. Promote it to
# `members` once it's confirmed to build.
exclude = [
    "bindings/godot",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
bincode = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
async-trait = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
parking_lot = "0.12"
rand = "0.8"
crc32fast = "1"
blake3 = "1"
wasmtime = "29"
