[workspace]
resolver = "2"
members = [
    "core/runtime",
    "core/network",
    "core/protocol",
    "core/session",
    "core/plugin",
    "core/scheduler",
    "core/security",
    "core/routing",
    "core/observability",
    "core/presentation",
    "domain",
    "application",
    "clients/mud",
    "tools/wat2wasm",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
bincode = "1"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
async-trait = "0.1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5"
parking_lot = "0.12"
rand = "0.8"
crc32fast = "1"
blake3 = "1"
wasmtime = "29"
